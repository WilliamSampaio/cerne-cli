name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate SemVer release tag
        run: sh scripts/validate-release-tag.sh "$GITHUB_REF_NAME"

  test:
    needs: validate-tag
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Validate standalone installer shell
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Run standalone installer fixture tests
        if: runner.os != 'Windows'
        run: sh test/install_test.sh
      - name: Validate release workflow contract
        if: runner.os != 'Windows'
        run: sh test/release_workflow_test.sh
      - name: Run Go vet
        run: go vet ./...
      - name: Run test suite
        run: go test -count=1 ./...

  release:
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          name="cerne_${VERSION}_${GOOS}_${GOARCH}"
          go build -ldflags "-X main.version=${VERSION}" -o cerne ./cmd/cerne
          tar -czf "${name}.tar.gz" cerne
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cerne_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: cerne_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            install.sh
            dist/checksums.txt
            dist/*.tar.gz
