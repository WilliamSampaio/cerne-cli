name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Validate embedded skill package contract
        run: go test ./internal/skillinstall
      - name: Validate standalone installer shell
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Run standalone installer fixture tests
        if: runner.os != 'Windows'
        run: sh test/install_test.sh
      - name: Validate release workflow contract
        if: runner.os != 'Windows'
        run: sh test/release_workflow_test.sh
      - name: Run Go vet
        run: go vet ./...
      - name: Run test suite
        run: go test ./...
